<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">ADIK producer and consumer workflow</title>
<desc id="desc">A developer's agent runs ADIK skills against a library to generate SDK source code and matching agentic elements in one versioned adik. A consumer's agent uses that bundle to integrate the SDK into an application.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#465878"/></marker></defs>
<rect width="1200" height="390" rx="16" fill="#f5f7fc"/>
<g font-family="system-ui, sans-serif" fill="#18233b"><text x="40" y="45" font-size="24" font-weight="700">ADIK produces the SDK and the context to implement it</text>
<g stroke="#465878" stroke-width="2" marker-end="url(#arrow)"><path d="M235 183H280"/><path d="M485 183H530"/><path d="M775 183H820"/><path d="M1015 183H1060"/></g>
<g stroke="#acb8d0"><rect x="30" y="105" width="205" height="155" rx="12" fill="white"/><rect x="280" y="105" width="205" height="155" rx="12" fill="#e4edff"/><rect x="530" y="95" width="245" height="175" rx="12" fill="#dff4e9"/><rect x="820" y="105" width="195" height="155" rx="12" fill="#e4edff"/><rect x="1060" y="105" width="115" height="155" rx="12" fill="white"/></g>
<g font-size="17" text-anchor="middle"><text x="132" y="140" font-weight="700">Tool / library</text><text x="132" y="174">Source code</text><text x="132" y="201">Public contract</text><text x="382" y="140" font-weight="700">ADIK skill suite</text><text x="382" y="174">Developer's agent</text><text x="382" y="201">generates the bundle</text><text x="652" y="133" font-weight="700">One versioned adik</text><text x="652" y="169">Actual SDK source</text><text x="652" y="196">Implementation skills</text><text x="652" y="223">Contracts + examples</text><text x="918" y="140" font-weight="700">Consumer's agent</text><text x="918" y="174">Reads bundled context</text><text x="918" y="201">Integrates + verifies</text><text x="1117" y="163" font-weight="700">User's</text><text x="1117" y="191" font-weight="700">application</text></g>
<text x="40" y="322" font-size="17">The chosen coding agents execute the work. ADIK provides generation skills and the artifact contract.</text><text x="40" y="351" font-size="17">Bundled library context guides implementation; the consumer agent inspects the app's relevant integration points.</text></g></svg>
