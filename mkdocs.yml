site_name: ADIK — Agentic Development and Implementation Kit
site_description: >-
  ADIK is a producer skill suite for generating SDK source and matching agentic
  elements as one versioned bundle for consumer coding agents.
site_url: https://mateors1.github.io/adik.md-agentic-development-and-implementation-kit-Framework/
repo_url: https://github.com/mateors1/adik.md-agentic-development-and-implementation-kit-Framework
repo_name: mateors1/adik.md
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started:
    - Quickstart Guide: getting-started/quickstart-guide.md
    - Consumer Guide: getting-started/consumer-guide.md
    - Migration to v2: getting-started/migration-v2.md
    - Pre-Deployment Walkthrough: getting-started/pre-deployment.md
    - Configuration Reference: getting-started/configuration.md
    - "Cheat Sheet: Building an adik": getting-started/cheatsheet-building.md
    - "Cheat Sheet: Consuming a Generated SDK": getting-started/cheatsheet-consuming.md
  - Specification:
    - ADIK Standard: specification/standard.md
    - Bundle Contract: specification/bundle-contract.md
    - Architecture: specification/architecture.md
    - Manifesto: specification/manifesto.md
  - Examples:
    - Runnable Reference: examples/reference-adik.md
    - Consumer Evaluation: examples/consumer-evaluation.md
    - "Showcase: Payments API (NestJS)": examples/showcase-payments-api.md
    - "Showcase: Task Manager (FastAPI)": examples/showcase-task-manager.md
    - "Showcase: Chat Service (TypeScript)": examples/showcase-chat-service.md
    - Build Your Own ADIK: examples/ADIKBuilderExample.md
    - Scaffold (Master Prompt): examples/scaffold.md
  - Security:
    - Red-Team Audit: security/red-team-audit-v2.md
  - Ecosystem:
    - "GitHub Spec Kit: Analysis & Integration": ecosystem/spec-kit.md
  - Maintainers:
    - Audit and Modernization: maintainers/audit-and-modernization.md
  - Community:
    - Launch Posts: community/launch-posts.md

markdown_extensions:
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - toc:
      permalink: true

validation:
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
