site_name: ADIK — Agentic Development and Implementation Kit
site_description: >-
  ADIK is a fully agentic framework for automating the creation and maintenance
  of SDKs for any project — API, service, or library.
site_url: https://mateors1.github.io/adik.md-agentic-development-and-implementation-kit-Framework/
repo_url: https://github.com/mateors1/adik.md-agentic-development-and-implementation-kit-Framework
repo_name: mateors1/adik.md
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search

nav:
  - Home: index.md
  - Quickstart: quickstart-guide.md
  - Architecture: architecture.md
  - Manifesto: manifesto.md
  - Standard:
    - ADIK Standard Specification: standard.md
  - Examples:
    - Pre-Deployment Walkthrough: examples/pre-deployment.md
    - "Showcase: Payments API (NestJS)": examples/showcase-payments-api.md
    - "Showcase: Task Manager (FastAPI)": examples/showcase-task-manager.md
    - "Showcase: Chat Service (TypeScript)": examples/showcase-chat-service.md
    - Build Your Own ADIK: examples/ADIKBuilderExample.md
    - Scaffold (Master Prompt): examples/scaffold.md
  - Security Audit: red-team-audit-v2.md

markdown_extensions:
  - tables
  - fenced_code
  - admonition
  - toc:
      permalink: true

validation:
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
